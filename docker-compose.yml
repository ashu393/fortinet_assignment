services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama

  api:
    build:
      context: ./api
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama
    volumes:
      - ./data:/app/data
